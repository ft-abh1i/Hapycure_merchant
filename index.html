<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#E35336">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Login · Hapycure Partner</title>
  <link rel="stylesheet" href="./assets/css/login.css?v=2026-08-07-login-hero-v2">
</head>
<body>
  <main id="page-login">
    <div class="login-wrap">
      <svg class="login-bg" viewBox="0 0 720 900" preserveAspectRatio="xMidYMin slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="loginRedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E35336"></stop>
            <stop offset="55%" stop-color="#E35336"></stop>
            <stop offset="100%" stop-color="#E35336"></stop>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="720" height="900" fill="#E35336"></rect>
        <path d="M0,270 C130,200 230,320 350,300 C470,280 540,160 720,110 L720,0 L0,0 Z" fill="url(#loginRedGrad)"></path>
        <circle cx="660" cy="35" r="220" fill="#fff" opacity="0.055"></circle>
        <circle cx="70" cy="205" r="118" fill="none" stroke="#fff" stroke-width="2" opacity="0.12"></circle>
        <path d="M-20 175 C130 115 220 235 365 175 S600 80 760 135" fill="none" stroke="#fff" stroke-width="3" opacity="0.1"></path>
      </svg>

      <div class="login-hero-copy">
        <div class="login-brand-lockup">
          <img src="./assets/images/hapycure-logo.png?v=2026-08-07-login-hero-v2" alt="Hapycure">
          <span>PARTNER</span>
        </div>
        <h1>Run your food business, beautifully.</h1>
        <p>Publish menus, create mess plans and stay available to customers.</p>
        <div class="login-hero-features" aria-label="Partner portal features">
          <span><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"></path></svg>Menus</span>
          <span><svg viewBox="0 0 24 24"><path d="M5 5h14v15H5zM8 3v4M16 3v4M5 9h14"></path></svg>Mess plans</span>
          <span><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M6 6l12 12M18 6 6 18"></path></svg>Go live</span>
        </div>
      </div>

      <section class="login-card" aria-labelledby="loginTitle">
        <h1 class="login-title" id="loginTitle">Welcome!</h1>
        <p class="login-subtitle">Let's get started with your mobile number</p>

        <label class="login-label" for="phoneNumber">PHONE NUMBER</label>
        <div class="login-phone-row">
          <span class="login-code">+91</span>
          <span class="login-dash">|</span>
          <input class="login-input" id="phoneNumber" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="Enter phone number">
        </div>

        <button class="login-continue-btn" id="continueLogin" type="button">Continue</button>
        <p class="login-msg" id="loginMsg" role="status" aria-live="polite"></p>

        <p class="login-terms">By continuing, you agree to our<br><span>Terms of Service</span> &amp; <span>Privacy Policy</span></p>

        <div class="login-or-row"><div class="line"></div><span>OR</span><div class="line"></div></div>

        <button class="login-google-btn" id="googleLogin" type="button">
          <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"></path>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1z"></path>
            <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.5C29.5 35.4 26.9 36 24 36c-5.3 0-9.7-3.1-11.4-7.7l-6.6 5.1C9.9 39.7 16.4 44 24 44z"></path>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.4-2.4 4.4-4.4 5.9l6.6 5.5C40.8 36.6 44 30.9 44 24c0-1.3-.1-2.7-.4-3.5z"></path>
          </svg>
          Continue with Google
        </button>
      </section>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="./assets/js/firebase-sync.js?v=2026-08-07-account-state-v2"></script>
  <script src="./assets/js/login.js?v=2026-08-07-account-state-v2"></script>
</body>
</html>
